<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Test - Syntax Highlighting</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .editor-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: #1E1E1E;
        }
        
        #code-input,
        #code-display {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 15px;
            margin: 0;
            border: none;
            outline: none;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: auto;
            box-sizing: border-box;
        }
        
        #code-input {
            resize: none;
            color: transparent;
            caret-color: #D4D4D4;
            background: transparent;
            z-index: 2;
        }
        
        #code-display {
            z-index: 1;
            pointer-events: none;
            background: #1E1E1E;
            color: #D4D4D4;
        }
        
        /* Syntax highlighting colors */
        .keyword { color: #C586C0; font-weight: bold; }
        .string { color: #CE9178; }
        .number { color: #B5CEA8; }
        .comment { color: #6A9955; font-style: italic; }
        .builtin { color: #4EC9B0; }
        .operator { color: #D4D4D4; }
        
        h1 { margin-bottom: 10px; }
        .info { 
            background: #2d2d30; 
            padding: 15px; 
            border-radius: 4px; 
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Basit Syntax Highlighting Testi</h1>
        
        <div class="info">
            <strong>Test Durumu:</strong> Bu sayfa overlay sistemini test eder.<br>
            <strong>Beklenen:</strong> Yazdığınız kod renkli görünmeli, HTML tagları görünmemeli.<br>
            <strong>Nasıl Test Edilir:</strong> Aşağıdaki editöre kod yazın ve renkleri görün.
        </div>
        
        <div class="editor-wrapper">
            <pre id="code-display"><code id="code-highlighted"></code></pre>
            <textarea id="code-input" placeholder="Buraya Türkçe kod yazın..."></textarea>
        </div>
    </div>
    
    <script>
        const input = document.getElementById('code-input');
        const display = document.getElementById('code-highlighted');
        
        // Türkçe keywords
        const keywords = ['değişken', 'sabit', 'eğer', 'değilse', 'döngü', 'için', 'herbir', 'içinde', 
                         'fonksiyon', 'dön', 'doğru', 'yanlış', 'boş'];
        const builtins = ['yaz', 'yazdır'];
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        function highlight(code) {
            if (!code) return '';
            
            let html = escapeHtml(code);
            
            // Highlight strings
            html = html.replace(/"([^"]*)"/g, '<span class="string">"$1"</span>');
            html = html.replace(/'([^']*)'/g, '<span class="string">\'$1\'</span>');
            
            // Highlight numbers
            html = html.replace(/\b(\d+\.?\d*)\b/g, '<span class="number">$1</span>');
            
            // Highlight keywords
            keywords.forEach(keyword => {
                const regex = new RegExp(`\\b${keyword}\\b`, 'g');
                html = html.replace(regex, `<span class="keyword">${keyword}</span>`);
            });
            
            // Highlight builtins
            builtins.forEach(builtin => {
                const regex = new RegExp(`\\b${builtin}\\b`, 'g');
                html = html.replace(regex, `<span class="builtin">${builtin}</span>`);
            });
            
            // Highlight comments
            html = html.replace(/\/\/(.*?)$/gm, '<span class="comment">//$1</span>');
            
            return html;
        }
        
        function updateHighlighting() {
            const code = input.value;
            display.innerHTML = highlight(code) + '\n';
            syncScroll();
        }
        
        function syncScroll() {
            const displayPre = document.getElementById('code-display');
            displayPre.scrollTop = input.scrollTop;
            displayPre.scrollLeft = input.scrollLeft;
        }
        
        // Event listeners
        input.addEventListener('input', updateHighlighting);
        input.addEventListener('scroll', syncScroll);
        
        // Tab key support
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = input.selectionStart;
                const end = input.selectionEnd;
                input.value = input.value.substring(0, start) + '    ' + input.value.substring(end);
                input.selectionStart = input.selectionEnd = start + 4;
                updateHighlighting();
            }
        });
        
        // Load sample code
        const sampleCode = `// Türkçe Örnek Kod
değişken meyveler = ["elma", "muz", "portakal"];

herbir (meyve içinde meyveler) {
    yaz("Meyve: " + meyve);
}

fonksiyon topla(a, b) {
    dön a + b;
}

değişken sonuç = topla(5, 3);
yaz("Toplam: " + sonuç);`;
        
        input.value = sampleCode;
        updateHighlighting();
    </script>
</body>
</html>
